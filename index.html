<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1a1a1a" />
  <title>Boom SOS — Highlands</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-top">
      <h1>Boom SOS</h1>
      <span class="store-tag" id="storeTag"></span>
    </div>
    <p class="header-sub" id="headerSub"></p>

    <div class="quick-contacts" id="quickContacts"></div>

    <div class="search-wrap">
      <input
        type="search"
        id="globalSearch"
        class="search"
        placeholder="What happened? walk-in down, internet out, guest comp, pest issue…"
        autocomplete="off"
      />
    </div>
    <div class="search-results" id="searchResults" hidden></div>
  </header>

  <!-- Tabs -->
  <nav class="tabs" id="tabs">
    <button class="tab active" data-tab="home">Home</button>
    <button class="tab" data-tab="vendors">Vendors</button>
    <button class="tab" data-tab="playbooks">Playbooks</button>
    <button class="tab" data-tab="ask">Ask Boom</button>
    <button class="tab" data-tab="log">Log</button>
    <button class="tab" data-tab="escalation">Escalate</button>
  </nav>

  <main>
    <!-- HOME: emergency cards -->
    <section class="panel active" id="panel-home">
      <h2 class="section-title">Emergencies</h2>
      <p class="section-hint">Tap one. It opens the steps.</p>
      <div class="card-grid" id="cardGrid"></div>
    </section>

    <!-- VENDORS -->
    <section class="panel" id="panel-vendors">
      <h2 class="section-title">Vendor directory</h2>
      <input type="search" id="vendorSearch" class="search small" placeholder="Search vendors…" autocomplete="off" />
      <div class="vendor-list" id="vendorList"></div>
    </section>

    <!-- PLAYBOOKS -->
    <section class="panel" id="panel-playbooks">
      <h2 class="section-title">Manager playbooks</h2>
      <p class="section-hint">What do I do — not just who do I call.</p>
      <div class="playbook-list" id="playbookList"></div>
    </section>

    <!-- ASK BOOM -->
    <section class="panel" id="panel-ask">
      <h2 class="section-title">Ask Boom</h2>
      <div class="ask-prompts" id="askPrompts"></div>
      <div class="ask-input-row">
        <input type="text" id="askInput" class="search" placeholder="Ask a question…" autocomplete="off" />
        <button class="btn primary" id="askBtn">Ask</button>
      </div>
      <div class="ask-answer" id="askAnswer"></div>
    </section>

    <!-- LOG -->
    <section class="panel" id="panel-log">
      <h2 class="section-title">Incident log</h2>
      <div class="log-views" id="logViews">
        <button class="chip active" data-view="open">Open</button>
        <button class="chip" data-view="today">Today</button>
        <button class="chip" data-view="week">This week</button>
        <button class="chip" data-view="repeat">Repeat issues</button>
        <button class="chip" data-view="all">All</button>
      </div>
      <div class="log-filters" id="logFilters">
        <button class="chip small active" data-filter="">All</button>
        <button class="chip small" data-filter="Equipment">Equipment</button>
        <button class="chip small" data-filter="Utilities">Utilities</button>
        <button class="chip small" data-filter="Staffing">Staffing</button>
        <button class="chip small" data-filter="Guest">Guest</button>
        <button class="chip small" data-filter="Vendor">Vendor</button>
        <button class="chip small" data-filter="Unresolved">Unresolved</button>
      </div>
      <button class="btn ghost full" id="newIncidentBtn">+ Log a new incident</button>
      <div class="incident-list" id="incidentList"></div>
    </section>

    <!-- ESCALATION -->
    <section class="panel" id="panel-escalation">
      <h2 class="section-title">Escalation ladder</h2>
      <div class="ladder" id="ladder"></div>
      <h3 class="sub-title">Red-level — go straight up</h3>
      <ul class="red-list" id="redList"></ul>
    </section>
  </main>

  <!-- Flow / form modal -->
  <div class="modal" id="modal" hidden>
    <div class="modal-card" id="modalCard"></div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast" hidden></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
